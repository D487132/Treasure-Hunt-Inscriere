<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treasure Hunt - Înscrieri</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --purple-dark: #3d2c5e;
      --purple-main: #5c3282;
      --magenta-dark: #8b004d;
      --magenta-bright: #b80068;
      --orange-accent: #d96b27;
      --bg-color: #fbf9f6;
      --text-dark: #231b30;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-dark);
      display: flex;
      justify-content: center;
      padding: 20px 10px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: white;
      border-radius: 24px;
      padding: 25px 20px;
      box-shadow: 0 10px 30px rgba(61, 44, 94, 0.15);
      border: 3px solid var(--purple-dark);
      position: relative;
    }

    .header-title {
      text-align: center;
      margin-bottom: 20px;
    }

    .header-title h1 {
      font-family: 'Fredoka One', cursive;
      font-size: 2.5rem;
      color: var(--purple-dark);
      letter-spacing: 2px;
      line-height: 1;
      text-transform: uppercase;
      text-shadow: 2px 2px 0px var(--magenta-dark);
    }

    .header-title .subtitle {
      font-family: 'Fredoka One', cursive;
      font-size: 1.1rem;
      color: var(--magenta-bright);
      margin-top: 5px;
    }

    .tagline {
      text-align: center;
      font-weight: 700;
      color: var(--purple-main);
      font-size: 1.1rem;
      margin-bottom: 20px;
      background: #f0e6f5;
      padding: 10px;
      border-radius: 12px;
    }

    .games-info {
      margin-bottom: 25px;
    }

    .game-card {
      background: #fdf6fa;
      border-left: 5px solid var(--orange-accent);
      padding: 12px 15px;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .game-card.lights {
      border-left-color: var(--purple-main);
    }

    .game-card h3 {
      font-family: 'Fredoka One', cursive;
      font-size: 1.1rem;
      color: var(--orange-accent);
    }

    .game-card.lights h3 {
      color: var(--purple-main);
    }

    .game-card p {
      font-size: 0.95rem;
      color: var(--text-dark);
      margin-top: 3px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--purple-dark);
    }

    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s;
    }

    input:focus {
      border-color: var(--purple-main);
    }

    .btn-submit {
      width: 100%;
      background: #25D366; /* Culoare WhatsApp */
      color: white;
      border: none;
      padding: 15px;
      border-radius: 14px;
      font-family: 'Fredoka One', cursive;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.4);
      transition: transform 0.2s, background-color 0.2s;
    }

    .btn-submit:hover {
      background: #20ba5a;
      transform: translateY(-2px);
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      font-weight: 700;
      color: var(--magenta-dark);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-title">
      <h1>TREASURE<br>HUNT</h1>
      <div class="subtitle">🦇 O singură aventură! 🦇</div>
    </div>

    <div class="tagline">
      Ești gata de distracție? Înscrie-te mai jos!
    </div>


    <!-- FORMULAR ÎNSCRIERE -->
    <form id="signupForm" onsubmit="sendToWhatsApp(event)">
      <div class="form-group">
        <label for="participantName">Nume și Prenume Participant *</label>
        <input type="text" id="participantName" required placeholder="ex: Andrei Popescu">
      </div>

      <div class="form-group">
        <label for="participantAge">Vârstă Participant *</label>
        <input type="number" id="participantAge" min="4" max="99" required placeholder="ex: 10">
      </div>

      <div class="form-group">
        <label for="participantPhone">Număr Telefon Participant *</label>
        <input type="tel" id="participantPhone" required placeholder="ex: 0712345678">
      </div>

      <button type="submit" class="btn-submit">
        <span>Trimite Înscrierea pe WhatsApp</span>
      </button>
    </form>

    <div class="footer">
      📸 @boogeybots
    </div>
  </div>

  <script>
    function sendToWhatsApp(event) {
      event.preventDefault();

      // --- CONFIGURARE NUMĂR TELEFON ORGANIZATOR ---
      // Schimbă numărul de mai jos cu numărul TĂU de telefon!
      // Format: 40 + numărul fără primul 0 (Exemplu: 40712345678)
      const myPhoneNumber = "40785799923"; 

      // Preluare date din formular
      const name = document.getElementById('participantName').value;
      const age = document.getElementById('participantAge').value;
      const phone = document.getElementById('participantPhone').value;

      // Creare text mesaj
      const message = `🎯 *ÎNSCRIERE NOUĂ TREASURE HUNT* 🎯\n\n` +
                      `👤 *Nume participant:* ${name}\n` +
                      `🎂 *Vârstă:* ${age} ani\n` +
                      `📞 *Telefon:* ${phone}`;

      // Encodare text pentru URL
      const encodedMessage = encodeURIComponent(message);

      // Generare link WhatsApp
      const whatsappUrl = `https://wa.me/${myPhoneNumber}?text=${encodedMessage}`;

      // Deschidere WhatsApp
      window.open(whatsappUrl, '_blank');
    }
  </script>

</body>
</html>
